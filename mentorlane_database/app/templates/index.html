<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MentorLane Flask Starter</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #f9f5ff 0%, #ffffff 45%, #f3f7ff 100%);
        color: #1a1333;
      }

      main {
        text-align: center;
        padding: 3rem 3.5rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 45px rgba(58, 50, 120, 0.15);
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 0.75rem;
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to MentorLane</h1>
      <p>Your new Flask project is ready to build.</p>
    </main>
  </body>
</html>
